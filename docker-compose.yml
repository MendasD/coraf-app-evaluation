services:
  db:
    image: postgres:16
    container_name: coraf_eval_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coraf_eval}
      POSTGRES_USER: ${POSTGRES_USER:-coraf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coraf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - coraf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coraf} -d ${POSTGRES_DB:-coraf_eval}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coraf_pgdata:
