{% extends "base.html" %}
{% block heading %}Mot de passe modifié{% endblock %}

{% block content %}
<div class="max-w-md bg-white rounded-2xl border border-slate-200 shadow-card p-6">
    <div class="flex items-start gap-3 mb-3">
        <span class="w-10 h-10 rounded-xl bg-coraf-50 text-coraf-700 inline-flex items-center justify-center"><i data-lucide="check-circle-2"></i></span>
        <div>
            <div class="font-semibold text-slate-900">Mot de passe mis à jour</div>
            <p class="text-sm text-slate-600 mt-1">Votre nouveau mot de passe est actif. Vous pouvez continuer à utiliser l'application.</p>
        </div>
    </div>
    <a href="{% url 'evaluations:dashboard' %}" class="inline-flex items-center gap-2 text-sm text-coraf-700 hover:text-coraf-900 font-medium">
        Retour au tableau de bord <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
</div>
{% endblock %}
