{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion · CORAF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-coraf-50 via-white to-amber-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-card mb-4">
                <img src="{% static 'img/logo_coraf.png' %}" alt="CORAF" class="h-12 w-auto">
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Évaluation des performances</h1>
            <p class="text-sm text-slate-500 mt-1">CORAF · Connectez-vous pour continuer</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-elevated p-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% if form.errors %}
                <div class="rounded-xl bg-red-50 border border-red-200 text-red-800 px-4 py-3 text-sm flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5"></i>
                    <span>Identifiants incorrects. Vérifiez votre adresse email et votre mot de passe.</span>
                </div>
                {% endif %}

                <div>
                    <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1.5">Adresse email</label>
                    <input type="email" name="username" id="id_username" autocomplete="email" required autofocus
                           placeholder="vous@coraf.org"
                           class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:border-coraf-500 focus:ring-2 focus:ring-coraf-100 outline-none">
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-medium text-slate-700 mb-1.5">Mot de passe</label>
                    <input type="password" name="password" id="id_password" autocomplete="current-password" required
                           class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:border-coraf-500 focus:ring-2 focus:ring-coraf-100 outline-none">
                </div>

                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-coraf-700 hover:bg-coraf-800 text-white px-4 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Se connecter
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">© CORAF · Évaluation des performances</p>
    </div>
    <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
