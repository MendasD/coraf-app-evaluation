{% extends "base.html" %}
{% block heading %}Collaborateurs{% endblock %}

{% block topbar_actions %}
{% if user.is_staff %}
<a href="{% url 'evaluations:collaborateur_create' %}" class="inline-flex items-center gap-2 bg-coraf-700 hover:bg-coraf-800 text-white text-sm font-medium px-3.5 py-2 rounded-lg shadow-sm transition">
    <i data-lucide="user-plus" class="w-4 h-4"></i> <span class="hidden sm:inline">Nouveau collaborateur</span><span class="sm:hidden">Nouveau</span>
</a>
{% endif %}
{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl border border-slate-200 shadow-card p-4 mb-5">
    <label for="search-collab" class="sr-only">Recherche</label>
    <div class="flex items-stretch rounded-lg border border-slate-300 bg-white focus-within:border-coraf-500 focus-within:ring-2 focus-within:ring-coraf-100 transition">
        <span class="px-3 flex items-center text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
        </span>
        <input type="search" name="q" id="search-collab" value="{{ q }}"
               placeholder="Rechercher par nom, prénom, direction, unité, projet, poste…"
               class="flex-1 min-w-0 bg-transparent px-1 py-2 text-sm outline-none border-0"
               hx-get="{% url 'evaluations:collaborateur_list' %}"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#collab-grid"
               hx-swap="innerHTML"
               hx-indicator="#search-spinner"
               autocomplete="off">
        <span id="search-spinner" class="htmx-indicator px-3 flex items-center text-coraf-700">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        </span>
        <button type="button" onclick="document.getElementById('search-collab').value=''; htmx.trigger('#search-collab', 'search');"
                class="px-3 flex items-center text-slate-400 hover:text-coraf-700 rounded-r-lg" title="Effacer la recherche">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
</div>

<div id="collab-grid">
    {% include "evaluations/_collaborateur_grid.html" %}
</div>

<style>
    .htmx-indicator { opacity: 0; transition: opacity 150ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
</style>
{% endblock %}
